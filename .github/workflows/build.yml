name: Build

# push / PR ごとにビルドできるか確認する。作った exe は Artifacts からも落とせる（試用向け）
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/WorkLog/WorkLog.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:Version=0.0.0-ci.${{ github.run_number }} `
            -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem publish | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: WorkLog-ci-${{ github.run_number }}
          path: publish/WorkLog.exe
          retention-days: 7
